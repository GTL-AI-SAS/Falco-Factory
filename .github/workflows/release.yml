name: Falco Factory release checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - run: npm run falco:doctor
      - run: npm test
      - run: npx playwright install chromium
        if: runner.os == 'Windows'
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: npm run test:browser
      - run: npm run test:worker-e2e
      - name: Build Windows Studio launcher
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/build-studio-launcher.ps1
      - name: Package Windows release
        if: runner.os == 'Windows'
        run: npm run release
      - name: Check packaged Windows launcher and Studio
        if: runner.os == 'Windows'
        run: npm run test:release
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest' && matrix.node == 24
        with:
          name: falco-factory
          path: dist/*.zip
          if-no-files-found: error

  staging:
    if: github.event_name == 'workflow_dispatch' && vars.FALCO_STAGING_URL != ''
    runs-on: ubuntu-latest
    environment: staging
    env:
      FALCO_STAGING_URL: ${{ vars.FALCO_STAGING_URL }}
      FALCO_STAGING_ORIGIN: ${{ vars.FALCO_STAGING_ORIGIN }}
      FALCO_STAGING_KV_REVISION: ${{ vars.FALCO_STAGING_KV_REVISION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - run: npm run test:staging
